name: CDP Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (Python 3.10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11 (for Spark)
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Ensure consistent dependencies for linting and testing
        pip install ruff black pytest-cov

    - name: Prepare Data Directories
      run: |
        # Create directories required by tests that are ignored by git
        mkdir -p data/raw data/parquet data/processed

    - name: Lint & Format Check
      run: |
        ruff check .
        black --check .

    - name: Run Pytest Suite
      run: |
        # Set dummy env vars for tests to avoid connection errors
        export MLFLOW_TRACKING_URI=http://localhost:5000
        export DATABASE_URL=sqlite:///./tests/test.db
        # Run tests with coverage report
        pytest tests/ -v --maxfail=3

    - name: Validate Launcher Entrypoints
      run: |
        # Dry-run check for the new launcher command structure
        python launcher.py --help