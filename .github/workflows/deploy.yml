name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-local.txt

      - name: Prepare Data Directories
        run: mkdir -p data/raw data/parquet data/processed

      - name: Run Backend Tests
        env:
          DATABASE_URL: sqlite:///./tests/test.db
          API_KEY: test-api-key
          MLFLOW_TRACKING_URI: http://localhost:5000
        run: |
          # Exclude e2e tests (require a live server on localhost:8000)
          python -m pytest tests/ --ignore=tests/e2e -v --maxfail=5

  deploy-backend:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not configured — skipping Render deploy."
            echo "   To enable: add RENDER_DEPLOY_HOOK_URL to GitHub repository secrets."
          else
            echo "🚀 Triggering Render deploy..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "✅ Render deploy triggered successfully."
          fi

  deploy-frontend:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Vercel
        run: echo "Vercel auto-deploys via GitHub Integration"
