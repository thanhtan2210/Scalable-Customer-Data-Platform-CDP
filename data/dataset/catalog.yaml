# Dataset Catalog for CDP End-to-End Testing & Profiling Benchmark
# Add new datasets here to automatically include them in tests and benchmarks.

datasets:
  - id: telco
    name: "Telco Customer Churn"
    file: "data/dataset/telco-customer-churn/Telco_Customer_Churn.csv"
    separator: ","
    target: "Churn"
    target_type: "string_binary"
    id_columns: ["customerID"]
    expected_nulls: true
    notes: "IBM/Kaggle benchmark dataset. TotalCharges has space values."
    status: "verified"

  - id: bank
    name: "Bank Customer Churn (Churn Modelling)"
    file: "data/dataset/bank-customer-churn/Churn_Modelling.csv"
    separator: ","
    target: "Exited"
    target_type: "int_binary"
    id_columns: ["RowNumber", "CustomerId", "Surname"]
    expected_nulls: false
    notes: "Target 'Exited' tested for synonym detection."
    status: "verified"

  - id: ecommerce
    name: "E-Commerce Customer Churn"
    file: "data/dataset/ecommerce-churn/E_Commerce_Dataset.csv"
    separator: ","
    target: "Churn"
    target_type: "int_binary"
    id_columns: ["CustomerID"]
    expected_nulls: true
    notes: "Imbalanced churn rate (~17%) with missing values."
    status: "verified"

  - id: bank_marketing_full
    name: "Bank Marketing (Full)"
    file: "data/dataset/bank-marketing/bank/bank-full.csv"
    separator: ";"
    target: "y"
    target_type: "string_binary"
    id_columns: []
    expected_nulls: false
    notes: "Semicolon separator. Target 'y' (yes/no). 45,211 rows."
    status: "verified"

  - id: bank_marketing_additional
    name: "Bank Marketing Additional (Full)"
    file: "data/dataset/bank-marketing/bank-additional/bank-additional/bank-additional-full.csv"
    separator: ";"
    target: "y"
    target_type: "string_binary"
    id_columns: []
    expected_nulls: false
    notes: "Semicolon separator. 21 features. 41,188 rows."
    status: "verified"

  # ── High-AUC datasets (typically >0.92) ──────────────────────────
  - id: credit_card
    name: "Credit Card Customer Churn"
    file: "data/dataset/credit-card-churn/BankChurners.csv"
    separator: ","
    target: "Attrition_Flag"
    target_type: "string_binary"
    id_columns: ["CLIENTNUM"]
    expected_nulls: false
    notes: "Kaggle: sakshigoyal7/credit-card-customers. 10,127 rows x 23 behavioral cols. AUC typically 0.95+ with LightGBM/XGBoost. Positive class = 'Attrited Customer'."
    status: "verified"

  - id: ibm_hr_attrition
    name: "IBM HR Employee Attrition"
    file: "data/dataset/ibm-hr-attrition/WA_Fn-UseC_-HR-Employee-Attrition.csv"
    separator: ","
    target: "Attrition"
    target_type: "string_binary"
    id_columns: ["EmployeeNumber"]
    expected_nulls: false
    notes: "Kaggle: pavansubhasht/ibm-hr-analytics-attrition-dataset. 1,470 rows x 35 features. Classic HR churn benchmark. Positive class = 'Yes'."
    status: "verified"

  # ── Multi-industry real-world benchmark suite ──────────────────────────
  - id: gym_model_fitness
    name: "Gym Model Fitness Churn"
    file: "data/dataset/gym-model-fitness/gym_churn.csv"
    separator: ","
    target: "Churn"
    target_type: "int_binary"
    id_columns: []
    expected_nulls: false
    industry: "fitness"
    source: "GitHub: bhutto17/Fitness-Center-Retention-Analysis"
    rows: 4000
    notes: "4,000 gym members. Churn ~27%. Features: visit frequency, contract type, lifetime."
    status: "new"

  - id: telecom_iran
    name: "Telecom Churn - Iran (UCI #563)"
    file: "data/dataset/telecom-churn-iran/telecom_churn_iran.csv"
    separator: ","
    target: "Churn"
    target_type: "int_binary"
    id_columns: []
    expected_nulls: false
    industry: "telecom"
    source: "UCI ML Repository #563"
    rows: 3150
    notes: "Iranian telecom. Churn ~16%. Warning: column names have double spaces — strip before use."
    status: "new"

  - id: online_shoppers
    name: "Online Shoppers Purchasing Intention (UCI #468)"
    file: "data/dataset/online-shoppers/online_shoppers_intention.csv"
    separator: ","
    target: "Revenue"
    target_type: "bool_binary"
    id_columns: []
    expected_nulls: false
    industry: "e_commerce"
    source: "UCI ML Repository #468"
    rows: 12330
    notes: "Target 'Revenue' is boolean — cast to int(0/1) before automl. Imbalanced ~15%."
    status: "new"

  - id: adult_income
    name: "Adult Income / Census (UCI #2)"
    file: "data/dataset/adult-income/adult_income.csv"
    separator: ","
    target: "income"
    target_type: "string_binary"
    id_columns: []
    expected_nulls: false
    industry: "demographics"
    source: "UCI ML Repository #2"
    rows: 32561
    notes: "Target: '>50K'=1, '<=50K'=0. Some string values contain trailing whitespace — strip needed."
    status: "new"

  - id: credit_card_default
    name: "Default of Credit Card Clients (UCI #350)"
    file: "data/dataset/credit-card-default/credit_card_default.csv"
    separator: ","
    target: "default"
    target_type: "int_binary"
    id_columns: ["ID"]
    expected_nulls: false
    industry: "finance"
    source: "UCI ML Repository #350 (CSV mirror: semnan-university-ai/GitHub)"
    rows: 30000
    notes: "Taiwan credit card defaults 2005. Target 'default' (0/1). Drop ID column before train."
    status: "new"

  - id: bank_marketing_downloaded
    name: "Bank Marketing Full — Downloaded (UCI #222)"
    file: "data/dataset/bank-marketing-full/bank_marketing.csv"
    separator: ","
    target: "y"
    target_type: "string_binary"
    id_columns: []
    expected_nulls: false
    industry: "banking"
    source: "UCI ML Repository #222"
    rows: 45211
    notes: "Same dataset as bank_marketing_full but re-downloaded as CSV (not semicolon). Target 'y': yes=1, no=0."
    status: "new"

  - id: healthcare_noshow
    name: "Medical Appointment No-Show (Brazil)"
    file: "data/dataset/healthcare-noshow/medical_appointment_noshow.csv"
    separator: ","
    target: "No-show"
    target_type: "string_binary"
    id_columns: ["PatientId", "AppointmentID"]
    expected_nulls: false
    industry: "healthcare"
    source: "Kaggle: joniarroba/noshowappointments (GitHub mirror: ksatola)"
    rows: 110527
    notes: "IMPORTANT: 'No-show'='Yes' means patient DID NOT show -> map Yes=1, No=0. Drop date columns. Largest dataset in suite."
    status: "new"

