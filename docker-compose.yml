services:
  # Database: Supabase local alternative
  db:
    image: postgres:15-alpine
    container_name: churn_platform_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-churn_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Object Storage: Cloudflare R2 local alternative
  minio:
    image: minio/minio:latest
    container_name: churn_platform_s3
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # MLflow Tracking Server
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: churn_platform_mlflow
    ports:
      - "5000:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-password}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server 
      --backend-store-uri postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-churn_db}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
    depends_on:
      - db
      - minio

  # Backend: FastAPI
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: churn_platform_api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - minio

  # Analytics: Streamlit
  analytics:
    build:
      context: .
      dockerfile: analytics/Dockerfile
    container_name: churn_platform_analytics
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
