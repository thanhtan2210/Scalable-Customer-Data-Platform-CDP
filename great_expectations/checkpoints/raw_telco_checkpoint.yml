name: raw_telco_checkpoint
config_version: 1.0
class_name: Checkpoint
run_name_template: "%Y%m%d-%H%M%S-raw"
validations:
  - batch_request:
      datasource_name: default_pandas_datasource
      data_connector_name: default_runtime_data_connector_name
      data_asset_name: raw_telco
      runtime_parameters:
        path: s3://datalake/raw/telco_churn.parquet
      batch_identifiers:
        default_identifier_name: default
      reader_method: read_parquet
      reader_options:
        storage_options:
          key: admin
          secret: password
          client_kwargs:
            endpoint_url: http://localhost:9000
    expectation_suite_name: raw_telco_suite
