config_version: 3.0

# Minimal GX config using filesystem stores and a runtime pandas datasource

datasources:
  default_pandas_datasource:
    class_name: Datasource
    execution_engine:
      class_name: PandasExecutionEngine
    data_connectors:
      default_runtime_data_connector_name:
        class_name: RuntimeDataConnector
        batch_identifiers:
          - default_identifier_name

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory: great_expectations/expectations/
  validations_store:
    class_name: ValidationsStore
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory: great_expectations/validations/
  checkpoint_store:
    class_name: CheckpointStore
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory: great_expectations/checkpoints/
  evaluation_parameter_store:
    class_name: EvaluationParameterStore

data_docs_sites: {}

anonymous_usage_statistics:
  enabled: false

config_variables_file_path: uncommitted/config_variables.yml
